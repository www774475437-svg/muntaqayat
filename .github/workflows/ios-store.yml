name: App Store page

# Sends the texts (and screenshots, when there are any) in store/appstore to App Store Connect.
on:
  push:
    paths: ['store/appstore/**', '.github/workflows/ios-store.yml']

jobs:
  page:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to App Store Connect
        env:
          ASC_KEY_ID: 2HD57BJA65
          ASC_ISSUER_ID: cdd9bda3-fcc0-46af-904a-266cb39164c7
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8"
          python3 - <<'PY'
          import json, os
          k = os.environ
          json.dump({"key_id": k["ASC_KEY_ID"], "issuer_id": k["ASC_ISSUER_ID"], "key": k["ASC_KEY_P8"], "in_house": False}, open(os.path.join(k["RUNNER_TEMP"], "asc.json"), "w"))
          PY
          echo "# options come from the command line" > Deliverfile
          SHOTS="--skip_screenshots true"
          if ls store/appstore/screenshots/ar-SA/*.png >/dev/null 2>&1; then SHOTS="--screenshots_path store/appstore/screenshots --overwrite_screenshots true"; fi
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.muntaqayat.muntaqayat --platform ios \
            --app_version 1.7.0 --skip_binary_upload true --metadata_path store/appstore/metadata $SHOTS \
            --force true --run_precheck_before_submit false --submit_for_review false
          rm -f "$RUNNER_TEMP/asc.json"

name: Screenshot site
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 412, height: 915 } });
            const base = 'https://www774475437-svg.github.io/salman-alemad/';
            await p.goto(base + '?v=' + Date.now()); await p.waitForTimeout(9000);
            await p.screenshot({ path: 'home.png' });
            await p.mouse.click(248, 868); await p.waitForTimeout(2500); await p.screenshot({ path: 'browse.png' });
            await p.mouse.click(155, 868); await p.waitForTimeout(2500); await p.screenshot({ path: 'account.png' });
            await p.mouse.click(52, 868); await p.waitForTimeout(2500);
            await p.keyboard.type('الصبر'); await p.waitForTimeout(2500); await p.screenshot({ path: 'search.png' });
            await b.close();
          })();
          JS
          node s.js
          for f in *.png; do echo "=====SHOT ${f%.png}"; base64 -w0 $f; echo; done

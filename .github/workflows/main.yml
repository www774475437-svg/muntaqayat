name: Build APK and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --org com.muntaqayat --project-name muntaqayat --platforms android .

      - name: Permanent signing key (from the KEY_PASSWORD secret)
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload.jks.enc -out android/app/upload.jks -pass env:KEY_PASSWORD
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the permanent key"
          else
            echo "KEY_PASSWORD secret not set - using debug key"
          fi

      - name: Patch Android (name, permission, signing)
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon (logo)
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk muntaqayat.apk

      - name: Build the Google Play bundle (AAB)
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} --dart-define=STORE=play
          cp build/app/outputs/bundle/release/app-release.aab muntaqayat.aab

      - name: Publish as latest release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poetry-${{ github.run_number }}
          name: منتقيات الشعر — نسخة ${{ github.run_number }}
          make_latest: true
          files: |
            muntaqayat.apk
            muntaqayat.aab

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform files
        run: flutter create --org com.muntaqayat --project-name muntaqayat --platforms ios .

      - name: Signing (certificate in the repository, its key behind KEY_PASSWORD, profile fetched with the App Store Connect key)
        id: sign
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ASC_KEY_ID: 2HD57BJA65
          ASC_ISSUER_ID: cdd9bda3-fcc0-46af-904a-266cb39164c7
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$KEY_PASSWORD" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -f signing/ios_dist.key.enc ] && [ -f signing/ios_dist.cer ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/ios_dist.key.enc -out "$RUNNER_TEMP/dist.key" -pass env:KEY_PASSWORD
            openssl x509 -inform DER -in signing/ios_dist.cer -out "$RUNNER_TEMP/dist.pem"
            openssl pkcs12 -export -legacy -inkey "$RUNNER_TEMP/dist.key" -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/dist.p12" -passout pass:ci || \
              openssl pkcs12 -export -inkey "$RUNNER_TEMP/dist.key" -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/dist.p12" -passout pass:ci
            security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
            security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain-db"
            security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
            security import "$RUNNER_TEMP/dist.p12" -P ci -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ci.keychain-db"
            security set-key-partition-list -S apple-tool:,apple: -k ci "$RUNNER_TEMP/ci.keychain-db" > /dev/null
            security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db" login.keychain-db
            rm -f "$RUNNER_TEMP/dist.key"
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
            python3 - <<'PY'
          import json, os
          k = os.environ
          json.dump({"key_id": k["ASC_KEY_ID"], "issuer_id": k["ASC_ISSUER_ID"], "key": open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{k['ASC_KEY_ID']}.p8")).read(), "in_house": False}, open(os.path.join(k["RUNNER_TEMP"], "asc.json"), "w"))
          PY
            fastlane sigh --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.muntaqayat.muntaqayat --provisioning_name "Muntaqayat App Store" --readonly true --output_path "$RUNNER_TEMP/pp" --filename appstore.mobileprovision
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$RUNNER_TEMP/pp/appstore.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
            rm -f "$RUNNER_TEMP/asc.json"
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "Signing for the App Store"
          else
            echo "on=0" >> "$GITHUB_OUTPUT"
            echo "Signing not complete yet - building unsigned to check that the app compiles"
          fi

      - name: Patch iOS (name, permissions, sign-in, signing)
        env:
          SIGN: ${{ steps.sign.outputs.on }}
        run: python3 tool/patch_ios.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/launcher/ios_icons.yaml

      - name: Build (unsigned check)
        if: steps.sign.outputs.on != '1'
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} --dart-define=STORE=play

      - name: Build the App Store file (IPA)
        if: steps.sign.outputs.on == '1'
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} --dart-define=STORE=play
          cp build/ios/ipa/*.ipa muntaqayat.ipa

      - name: Send to TestFlight
        if: steps.sign.outputs.on == '1'
        env:
          ASC_KEY_ID: 2HD57BJA65
          ASC_ISSUER_ID: cdd9bda3-fcc0-46af-904a-266cb39164c7
        run: xcrun altool --upload-app -f muntaqayat.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the key from the runner
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Keep the IPA
        if: steps.sign.outputs.on == '1'
        uses: actions/upload-artifact@v4
        with:
          name: muntaqayat-ipa
          path: muntaqayat.ipa
          retention-days: 14

  website:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform files
        run: flutter create --org com.muntaqayat --project-name muntaqayat --platforms web .

      - run: flutter pub get

      - name: Web page title, description and icons
        run: python3 tool/patch_web.py

      - name: Build website
        run: flutter build web --release --no-web-resources-cdn --base-href /

      - name: Privacy page
        run: cp -r tool/web_pages/. build/web/

      - name: Publish website (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          cname: muntaqayat.com
          force_orphan: true

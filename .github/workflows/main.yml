name: Build APK and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --org com.muntaqayat --project-name muntaqayat --platforms android .

      - name: Permanent signing key (from the KEY_PASSWORD secret)
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload.jks.enc -out android/app/upload.jks -pass env:KEY_PASSWORD
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n" "$KEY_PASSWORD" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the permanent key"
          else
            echo "KEY_PASSWORD secret not set - using debug key"
          fi

      - name: Patch Android (name, permission, signing)
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon (logo)
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk muntaqayat.apk

      - name: Publish as latest release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poetry-${{ github.run_number }}
          name: منتقيات الشعر — نسخة ${{ github.run_number }}
          make_latest: true
          files: muntaqayat.apk

  website:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform files
        run: flutter create --org com.muntaqayat --project-name muntaqayat --platforms web .

      - run: flutter pub get

      - name: Web page title, description and icons
        run: python3 tool/patch_web.py

      - name: Build website
        run: flutter build web --release --no-web-resources-cdn --base-href /muntaqayat/

      - name: Privacy page
        run: cp -r tool/web_pages/. build/web/

      - name: Publish website (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

name: Probe channel
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          def get(u):
              r=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(r,timeout=20) as f: return f.geturl(), f.read().decode('utf-8','replace')
              except Exception as e: return 'ERR',str(e)
          u,b=get('https://t.me/s/salmansalehalemad'); print('S:',u,len(b)); print(re.sub(r'\s+',' ',b)[-3000:])
          for i in (1,50,200,500,1000,2000,3000):
              u,b=get('https://t.me/salmansalehalemad/%d?embed=1&mode=tme'%i)
              t=re.search(r'tgme_widget_message_text[^>]*>(.*?)</div>',b,re.S)
              print(i,u,len(b),'TEXT' if t else 'none', (re.sub('<[^>]+>','',t.group(1))[:120] if t else re.findall(r'tgme_widget_message_error[^>]*>(.*?)<',b)[:1]))
          PY

name: probe fnoor
on:
  push:
    branches: [probe-fnoor]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          for u in https://www.fnoor.com/main/ https://www.fnoor.com/ https://www.fnoor.com/sitemap.xml https://www.fnoor.com/robots.txt; do
            f=$(echo $u | sed 's/[^a-z0-9]/_/g'); curl -sSL -A "$UA" -m 40 -o $f.html -w "$u %{http_code} %{size_download} %{url_effective}\n" "$u" || true
          done
          grep -oiE 'href="[^"]+"' https___www_fnoor_com_main_.html | sort | uniq -c | sort -rn | head -100 > links.txt || true
          ls -la
          head -c 1500 https___www_fnoor_com_main_.html; echo
          curl -sS -I -A "$UA" https://www.fnoor.com/main/ | head -20
          curl -sS -o /dev/null -w 'http: %{http_code}\n' http://www.fnoor.com/main/
          curl -sS -o /dev/null -w 'nowww: %{http_code}\n' https://fnoor.com/main/
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: out}

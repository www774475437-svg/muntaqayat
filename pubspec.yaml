name: muntaqayat
description: "منتقيات الشعر — مختارات من عيون الشعر العربي مرتبة على الأبواب والعصور والشعراء"
publish_to: 'none'
version: 1.7.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  home_widget: ^0.7.0
  flutter_tts: ^4.2.2
  youtube_player_iframe: ^5.2.1
  firebase_core: '>=3.8.0 <6.0.0'
  firebase_ai: '>=3.11.0 <5.0.0'
  firebase_auth: '>=5.3.3 <8.0.0'
  cloud_firestore: '>=5.5.0 <8.0.0'
  google_sign_in: '>=6.2.1 <7.0.0'

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/launcher/main_icon.png
  adaptive_icon_background: "#F7F4EE"
  adaptive_icon_foreground: tool/launcher/main_fg.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: NotoNastaliq
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700
